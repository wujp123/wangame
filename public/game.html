<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Machine Pro</title>
    <!-- 依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://pixijs.download/v7.x/pixi.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        body {
            background-color: #000;
            margin: 0; padding: 0; overflow: hidden;
            display: flex; justify-content: center; align-items: flex-start;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }

        #app-scaler { transform-origin: top center; width: 500px; padding-bottom: 50px; }

        .machine-body {
            width: 100%;
            background: linear-gradient(to bottom, #b71c1c, #8e0000);
            border-radius: 0 0 30px 30px; padding: 15px; box-sizing: border-box;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5); border-bottom: 5px solid #ff4d4d;
        }

        /* 奖池面板 */
        .jackpot-panel {
            background: linear-gradient(to bottom, #3e2723, #000);
            border: 2px solid #ffd700; border-radius: 10px; padding: 5px 15px;
            margin-bottom: 10px; text-align: center; box-shadow: 0 0 15px #ff6f00;
            position: relative; overflow: hidden;
        }
        .jackpot-label { color: #ffca28; font-size: 10px; letter-spacing: 2px; font-weight: bold; }
        .jackpot-value {
            font-family: 'Orbitron', monospace; color: #fff176; font-size: 24px;
            text-shadow: 0 0 10px #ffd700;
        }

        /* 屏幕信息 */
        .screen-panel {
            background: linear-gradient(to bottom, #1565c0, #0d47a1);
            border-radius: 10px; padding: 10px; margin-bottom: 10px;
            border: 2px solid #42a5f5; display: flex; justify-content: space-between;
        }
        .lcd-group { text-align: center; flex: 1; }
        .lcd-label { color: #81d4fa; font-size: 10px; margin-bottom: 2px; font-weight: bold; }
        .lcd-display { background: #000; border: 1px solid #555; border-radius: 4px; padding: 2px 5px; margin: 0 5px;}
        .lcd-value { font-family: 'Orbitron', monospace; color: #ff5252; font-size: 20px; letter-spacing: 1px; }

        /* 游戏区域 */
        #game-container {
            width: 470px; height: 470px; margin: 0 auto 10px auto;
            background: radial-gradient(circle, #fff8e1, #ffecb3);
            border-radius: 10px; border: 4px solid #333;
            display: flex; justify-content: center; align-items: center;
        }

        /* 控制区 */
        .control-panel {
            background: linear-gradient(to bottom, #1976d2, #0d47a1);
            border-radius: 15px; padding: 10px; border-top: 2px solid #64b5f6;
        }
        .func-buttons { display: flex; gap: 5px; margin-bottom: 10px; }
        .btn-large {
            flex: 1; height: 50px; border-radius: 8px; border: none;
            color: white; font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.4);
        }
        .btn-large:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
        .btn-green { background: linear-gradient(#66bb6a, #2e7d32); }
        .btn-purple { background: linear-gradient(#ab47bc, #6a1b9a); }
        .btn-yellow { background: linear-gradient(#ffee58, #fbc02d); color: #b71c1c; font-size: 20px; }
        .btn-blue { background: linear-gradient(#42a5f5, #1565c0); }

        /* 下注按钮 */
        .bet-buttons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
        .bet-unit { display: flex; flex-direction: column; align-items: center; }
        .bet-lcd {
            background: #000; color: #fff; font-family: 'Orbitron', monospace; width: 100%;
            text-align: center; font-size: 10px; border: 1px solid #555; margin-bottom: 3px;
        }
        .btn-fruit {
            width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
            box-shadow: 0 3px 0 rgba(0,0,0,0.5), inset 0 3px 6px rgba(255,255,255,0.3);
            color: #fff; text-shadow: 1px 1px 0 #000; font-size: 10px; font-weight: bold; padding: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-fruit:active { transform: translateY(3px); box-shadow: none; }

        /* 动态生成的赔率条 */
        #oddsDisplayContainer {
            display: flex; justify-content: space-between; margin-top: 5px;
            color: #fff; font-size: 9px; opacity: 0.8; padding: 0 5px;
        }

        /* 颜色类 */
        .c-bar { background: linear-gradient(#81c784, #2e7d32); }
        .c-77 { background: linear-gradient(#ba68c8, #7b1fa2); }
        .c-star { background: linear-gradient(#fff176, #fbc02d); color: #333; }
        .c-water { background: linear-gradient(#ef5350, #c62828); }
        .c-bell { background: linear-gradient(#ffca28, #ff6f00); }
        .c-lemon { background: linear-gradient(#aed581, #558b2f); }
        .c-orange { background: linear-gradient(#ffa726, #e65100); }
        .c-apple { background: linear-gradient(#ef5350, #b71c1c); }
        .c-lucky { background: linear-gradient(135deg, #ff4081, #c51162); border: 2px solid #fff; }

        /* 弹窗样式 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #fff; width: 320px; border-radius: 12px; padding: 0; overflow: hidden;
            font-family: sans-serif; box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .modal-header {
            background: #eee; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd;
        }
        .modal-header h3 { margin: 0; font-size: 16px; color: #333; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #666; }

        .modal-tabs { display: flex; border-bottom: 1px solid #ddd; }
        .modal-tabs button {
            flex: 1; padding: 12px; background: #fff; border: none; font-weight: bold; cursor: pointer; color: #777;
        }
        .modal-tabs button.active { border-bottom: 3px solid #1976d2; color: #1976d2; }

        .tab-panel { padding: 20px; }
        .hint { font-size: 12px; color: #666; margin-top: 0; }
        .input-group { display: flex; gap: 5px; }
        .input-group input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

        .btn-action {
            background: #1976d2; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .btn-red { background: #d32f2f; width: 100%; padding: 12px; }

        .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .channel-btn {
            background: #fff; border: 1px solid #ccc; padding: 10px; border-radius: 5px;
            cursor: pointer; font-size: 13px; color: #333; transition: all 0.2s;
        }
        .channel-btn.active {
            background: #e3f2fd; border-color: #2196f3; color: #1565c0; font-weight: bold;
            box-shadow: 0 0 5px rgba(33, 150, 243, 0.3);
        }

        /* Loading 遮罩 */
        #loading-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: flex;
            justify-content: center; align-items: center; color: #fff;
            font-family: 'Orbitron', sans-serif; font-size: 18px;
        }
    </style>
</head>
<body>

<!-- Loading -->
<div id="loading-mask">INITIALIZING...</div>

<div id="app-scaler">
    <div class="machine-body">
        <div class="jackpot-panel">
            <div class="jackpot-label">GRAND JACKPOT</div>
            <div class="jackpot-value" id="jackpotDisplay">0.00</div>
        </div>

        <div class="screen-panel">
            <div class="lcd-group">
                <div class="lcd-label">WIN</div>
                <div class="lcd-display"><div class="lcd-value" id="winDisplay">0</div></div>
            </div>
            <div class="lcd-group">
                <div class="lcd-label">CREDIT</div>
                <div class="lcd-display"><div class="lcd-value" id="balanceDisplay">---</div></div>
            </div>
        </div>

        <div id="game-container"></div>

        <div class="control-panel">
            <div class="func-buttons">
                <button class="btn-large btn-blue" onclick="openWallet()">充值</button>
                <button class="btn-large btn-green" onclick="resetBets()">RESET</button>
                <button class="btn-large btn-purple" onclick="toggleAuto()">AUTO</button>
                <button class="btn-large btn-yellow" id="startBtn" onclick="spin()">GO</button>
            </div>

            <!-- 动态生成的下注按钮 -->
            <div class="bet-buttons" id="betButtonsContainer"></div>

            <!-- 动态生成的赔率显示 -->
            <div id="oddsDisplayContainer">Loading Config...</div>
        </div>
    </div>
</div>

<!-- 钱包弹窗 -->
<div id="walletModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3>资金钱包</h3>
            <button onclick="closeWallet()" class="close-btn">×</button>
        </div>

        <div class="modal-tabs">
            <button id="tabDep" class="active" onclick="switchTab('deposit')">充值</button>
            <button id="tabWdr" onclick="switchTab('withdraw')">提现</button>
        </div>

        <!-- 充值面板 -->
        <div id="panelDeposit" class="tab-panel">
            <p class="hint">请选择支付方式：</p>
            <div id="channelList" class="channel-grid">
                <div style="text-align:center; color:#999; font-size:12px;">正在加载通道...</div>
            </div>

            <div id="depositInputArea" style="display:none; margin-top:15px; border-top:1px solid #eee; padding-top:10px;">
                <p class="hint">
                    当前汇率: <span id="currentRate" style="color:#d32f2f; font-weight:bold;">1.0</span>
                    (1元 = <span id="rateVal">?</span> 积分)
                </p>
                <div class="input-group">
                    <input type="number" id="depAmount" placeholder="输入充值金额" value="100">
                    <button class="btn-action" onclick="doDeposit()">立即支付</button>
                </div>
                <p class="hint" style="margin-top:5px;">预计到账: <span id="calcPoints" style="color:#2e7d32; font-weight:bold;">0</span> 积分</p>
            </div>

            <div id="depResult" style="display:none; margin-top:15px; background:#f9f9f9; padding:10px; border-radius:5px; border:1px solid #ddd;"></div>
        </div>

        <!-- 提现面板 -->
        <div id="panelWithdraw" class="tab-panel" style="display:none;">
            <p class="hint">当前余额: <span id="walletBalance">0.00</span></p>
            <input type="number" id="wdrAmount" placeholder="提现金额" style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px;">
            <input type="text" id="wdrAddress" placeholder="USDT 钱包地址 (TRC20)" style="width:100%; box-sizing:border-box; margin-bottom:10px; padding:10px;">
            <button class="btn-action btn-red" onclick="doWithdraw()">提交申请</button>
        </div>
    </div>
</div>

<script>
    // --- 0. 环境初始化 ---
    const tg = window.Telegram.WebApp;
    tg.ready();
    try {
        tg.expand();
        tg.setHeaderColor('#b71c1c');
    } catch(e){}

    // --- 1. 全局拦截器 (处理 Token 过期) ---
    axios.interceptors.response.use(response => {
        return response;
    }, error => {
        if (error.response && error.response.status === 401) {
            console.warn("Token expired or unauthorized");
            // 可以在这里选择重新触发登录逻辑，或者提示用户
        }
        return Promise.reject(error);
    });

    // --- 2. 核心状态 ---
    let FRUIT_CONFIG = [];
    let BOARD_LAYOUT = [];
    let currentBets = {};
    let isSpinning = false;
    let autoPlay = false;
    let activeChannel = null;

    // --- 3. 登录逻辑 (增强版) ---
    async function loginWithTelegram() {
        let token = localStorage.getItem('game_token');
        let isSuccess = false;

        // 优先使用 Telegram 无感登录
        if (tg.initData) {
            try {
                // 后端路由需匹配: Route::post('/auth/telegram', ...)
                const res = await axios.post('/api/auth/telegram', {
                    init_data: tg.initData
                });
                if (res.data.token) {
                    token = res.data.token;
                    localStorage.setItem('game_token', token);
                    console.log("TG Auto-Login Success:", res.data.user?.name);
                    isSuccess = true;
                }
            } catch (e) {
                console.error("Auto-Login Failed:", e);
            }
        }

        // 如果不在 TG 环境，检查本地是否有旧 Token (游客/测试模式)
        if (token) {
            axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;
            if (!isSuccess && !tg.initData) isSuccess = true; // 本地有 Token 也算一种成功
        }

        return isSuccess;
    }

    // --- 4. 支付回调监听 (NOWPayments 跳转回来) ---
    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');

        if (status === 'success') {
            window.history.replaceState({}, document.title, window.location.pathname);
            alert("支付成功！系统确认中，积分稍后到账。");
            setTimeout(refreshBalance, 3000);
        } else if (status === 'cancel') {
            alert("支付流程已取消");
        }
    });

    // --- 5. 游戏启动流程 (串行执行) ---
    (async function initGame() {
        try {
            // A. 等待登录
            const loginOk = await loginWithTelegram();

            // B. 如果登录彻底失败，停止加载
            if (!loginOk && !localStorage.getItem('game_token')) {
                document.getElementById('loading-mask').innerText = "Login Failed / Please open in Telegram";
                return;
            }

            // C. 加载配置 (此接口建议在后端设为 public)
            const res = await axios.get('/api/game/config');
            const data = res.data.data;

            FRUIT_CONFIG = data.fruits;
            BOARD_LAYOUT = data.layout;

            // 初始化数据
            FRUIT_CONFIG.forEach(f => {
                if(f.id !== 9) currentBets[f.id] = 0;
            });

            // 渲染
            initBoard();
            initBetButtons();
            initOddsLabels();

            // D. 加载余额 (需要权限)
            await refreshBalance();

            // E. 移除 Loading
            document.getElementById('loading-mask').style.display = 'none';

        } catch (e) {
            console.error(e);
            document.getElementById('loading-mask').innerText = "Connection Error";
            document.getElementById('oddsDisplayContainer').innerText = "Config Load Failed";
        }
    })();

    // --- 6. 屏幕适配 ---
    function resizeApp() {
        const scaler = document.getElementById('app-scaler');
        const scale = Math.min(window.innerWidth / 500, 1);
        scaler.style.transform = `scale(${scale})`;
        document.body.style.height = (scaler.offsetHeight * scale) + 'px';
    }
    window.addEventListener('resize', resizeApp);
    resizeApp();

    // --- 7. 音频引擎 ---
    const sndClick = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'], volume: 0.5 });
    const sndSpin  = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2044/2044-preview.mp3'], loop: true, volume: 0.4 });
    const sndWin   = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'], volume: 0.8 });
    const sndLucky = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3'], volume: 1.0 });
    const sndStop  = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3'], volume: 0.5 });

    // 解决浏览器音频自动播放限制
    document.body.addEventListener('click', () => { if (Howler.ctx && Howler.ctx.state !== 'running') Howler.ctx.resume(); }, { once: true });

    // --- 8. PixiJS 渲染 ---
    const app = new PIXI.Application({ width: 470, height: 470, backgroundColor: 0x000000, backgroundAlpha: 0 });
    document.getElementById('game-container').appendChild(app.view);
    const squares = [];

    function initBoard() {
        const centerStyle = new PIXI.TextStyle({
            fill: ['#d4af37', '#b8860b'], fontSize: 48, fontWeight: 'bold',
            dropShadow: true, dropShadowColor: '#000000', dropShadowBlur: 4
        });
        const centerText = new PIXI.Text('LUCKY', centerStyle);
        centerText.anchor.set(0.5); centerText.x = 235; centerText.y = 235;
        app.stage.addChild(centerText);

        const size = 56; const gap = 4; const step = size + gap;
        const startX = 27; const startY = 27;
        const coords = [];

        for(let i=0; i<7; i++) coords.push({x: startX + i*step, y: startY});
        for(let i=1; i<=6; i++) coords.push({x: startX + 6*step, y: startY + i*step});
        for(let i=5; i>=0; i--) coords.push({x: startX + i*step, y: startY + 6*step});
        for(let i=5; i>=1; i--) coords.push({x: startX, y: startY + i*step});

        coords.forEach((pos, index) => {
            const container = new PIXI.Container();
            container.x = pos.x; container.y = pos.y;

            const fruitId = BOARD_LAYOUT[index];
            const config = FRUIT_CONFIG.find(f => f.id === fruitId);

            const bg = new PIXI.Graphics();
            bg.lineStyle(2, 0x5d4037);
            if(fruitId === 9) bg.beginFill(0xe91e63);
            else bg.beginFill(0xffecb3);
            bg.drawRoundedRect(0, 0, size, size, 8); bg.endFill();
            container.addChild(bg);

            const textStr = config ? config.name : '?';
            const text = new PIXI.Text(textStr, {
                fontSize: fruitId === 9 ? 12 : 14,
                fill: fruitId === 9 ? '#fff' : '#444',
                fontWeight: 'bold'
            });
            text.anchor.set(0.5); text.position.set(size/2, size/2);
            container.addChild(text);

            const highlight = new PIXI.Graphics();
            highlight.lineStyle(4, 0xff0000); highlight.beginFill(0xffeb3b, 0.3);
            highlight.drawRoundedRect(-2, -2, size+4, size+4, 8); highlight.endFill();
            highlight.visible = false;
            container.addChild(highlight);

            squares.push({ highlight: highlight, id: fruitId });
            app.stage.addChild(container);
        });
        updateHighlight(0);
    }

    function initBetButtons() {
        const container = document.getElementById('betButtonsContainer');
        container.innerHTML = '';
        const bettable = FRUIT_CONFIG.filter(f => f.id !== 9);
        bettable.forEach(fruit => {
            const unit = document.createElement('div');
            unit.className = 'bet-unit';
            const lcd = document.createElement('div');
            lcd.className = 'bet-lcd';
            lcd.id = `bet-val-${fruit.id}`;
            lcd.innerText = '0';
            const btn = document.createElement('button');
            btn.className = `btn-fruit ${fruit.color}`;
            btn.innerText = fruit.name;
            btn.onclick = () => { tgTrigger('light'); addBet(fruit.id); };
            unit.appendChild(lcd); unit.appendChild(btn);
            container.appendChild(unit);
        });
    }

    function initOddsLabels() {
        const container = document.getElementById('oddsDisplayContainer');
        container.innerHTML = '';
        const bettable = FRUIT_CONFIG.filter(f => f.id !== 9);
        bettable.forEach(fruit => {
            const span = document.createElement('span');
            span.innerText = `x${fruit.multiplier}`;
            container.appendChild(span);
        });
    }

    function addBet(id) {
        if(isSpinning) return;
        sndClick.play();
        currentBets[id] += 10;
        document.getElementById(`bet-val-${id}`).innerText = currentBets[id];
    }

    function resetBets() {
        if(isSpinning) return;
        sndClick.play(); tgTrigger('medium');
        for(let id in currentBets) {
            currentBets[id] = 0;
            const el = document.getElementById(`bet-val-${id}`);
            if(el) el.innerText = 0;
        }
    }

    function toggleAuto() {
        autoPlay = !autoPlay;
        tgNotify(autoPlay ? 'success' : 'warning');
        alert(autoPlay ? 'Auto ON' : 'Auto OFF');
    }

    async function refreshBalance() {
        try {
            const res = await axios.get('/api/game/balance');
            const data = res.data.data;
            document.getElementById('balanceDisplay').innerText = String(data.balance).padStart(8, '0');
            document.getElementById('jackpotDisplay').innerText = parseFloat(data.jackpot).toFixed(2);
        } catch(e) {
            // 如果获取余额失败（如 Token 失效），显示 ---
            document.getElementById('balanceDisplay').innerText = "---";
        }
    }

    function updateHighlight(idx) {
        squares.forEach(s => s.highlight.visible = false);
        if(squares[idx]) squares[idx].highlight.visible = true;
    }

    function runToStop(targetIndex, speedMult = 1) {
        return new Promise(resolve => {
            let currentIdx = squares.findIndex(s => s.highlight.visible);
            if(currentIdx < 0) currentIdx = 0;
            let rounds = 0;
            const minRounds = 2;
            const baseTime = 50 / speedMult;
            const timer = setInterval(() => {
                currentIdx++;
                if(currentIdx >= 24) { currentIdx = 0; rounds++; }
                updateHighlight(currentIdx);
                if(rounds >= minRounds && currentIdx === targetIndex) {
                    clearInterval(timer);
                    resolve();
                }
            }, baseTime);
        });
    }

    async function spin() {
        const totalBet = Object.values(currentBets).reduce((a,b)=>a+b, 0);
        if (totalBet === 0) return alert("请先下注");
        isSpinning = true;
        tgTrigger('heavy');
        document.getElementById('winDisplay').innerText = "0";
        sndWin.stop(); sndSpin.play();

        try {
            const res = await axios.post('/api/game/spin', { bets: currentBets });
            const data = res.data.data;
            const stops = data.stops || [data.stop_index];

            for(let i=0; i<stops.length; i++) {
                const target = stops[i];
                const isFinal = (i === stops.length - 1);
                const speed = (i > 0) ? 2.5 : 1.0;
                await runToStop(target, speed);
                if (!isFinal) {
                    sndSpin.pause(); sndLucky.play(); tgNotify('success');
                    const blinkTimer = setInterval(() => {
                        squares[target].highlight.visible = !squares[target].highlight.visible;
                    }, 100);
                    await new Promise(r => setTimeout(r, 1500));
                    clearInterval(blinkTimer);
                    sndSpin.play();
                }
            }

            isSpinning = false; sndSpin.stop();
            document.getElementById('balanceDisplay').innerText = String(data.balance).padStart(8, '0');
            document.getElementById('winDisplay').innerText = data.win_amount;
            if(data.jackpot) document.getElementById('jackpotDisplay').innerText = parseFloat(data.jackpot).toFixed(2);

            if(data.win_amount > 0) {
                sndWin.play(); tgNotify('success');
                let b = 0;
                let t = setInterval(()=>{
                    document.getElementById('winDisplay').style.color = b++%2?'#fff':'#ff5252';
                    if(b>10) clearInterval(t);
                }, 100);
            } else {
                sndStop.play(); tgTrigger('light');
            }

            if(autoPlay && data.balance >= totalBet) {
                setTimeout(spin, 1500);
            } else if (autoPlay) {
                autoPlay = false; alert("余额不足，自动停止");
            }

        } catch (err) {
            isSpinning = false; sndSpin.stop();
            console.error(err);
            alert("Error: " + (err.response?.data?.message || "网络错误"));
        }
    }

    function tgTrigger(style) { if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred(style); }
    function tgNotify(type) { if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred(type); }

    // --- 9. 钱包逻辑 ---

    async function openWallet() {
        refreshBalance();
        document.getElementById('walletBalance').innerText = document.getElementById('balanceDisplay').innerText;
        document.getElementById('walletModal').style.display = 'flex';
        await loadChannels();
    }

    function closeWallet() {
        document.getElementById('walletModal').style.display = 'none';
        document.getElementById('depResult').style.display = 'none';
    }

    function switchTab(type) {
        document.getElementById('tabDep').className = type === 'deposit' ? 'active' : '';
        document.getElementById('tabWdr').className = type === 'withdraw' ? 'active' : '';
        document.getElementById('panelDeposit').style.display = type === 'deposit' ? 'block' : 'none';
        document.getElementById('panelWithdraw').style.display = type === 'withdraw' ? 'block' : 'none';
    }

    async function loadChannels() {
        const container = document.getElementById('channelList');
        try {
            const res = await axios.get('/api/deposit/channels');
            const channels = res.data.data;
            container.innerHTML = '';
            if(channels.length === 0) {
                container.innerHTML = '<p class="hint">暂无可用支付通道</p>';
                return;
            }
            channels.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerHTML = `${ch.name}`;
                btn.onclick = () => selectChannel(ch, btn);
                container.appendChild(btn);
            });
        } catch (e) {
            container.innerHTML = '<p class="hint" style="color:red">加载失败</p>';
        }
    }

    function selectChannel(channel, btnElement) {
        activeChannel = channel;
        document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('depositInputArea').style.display = 'block';
        document.getElementById('currentRate').innerText = channel.exchange_rate;
        document.getElementById('rateVal').innerText = channel.exchange_rate;
        document.getElementById('depResult').style.display = 'none';
        calcPreview();
    }

    document.getElementById('depAmount').addEventListener('input', calcPreview);

    function calcPreview() {
        if(!activeChannel) return;
        const val = parseFloat(document.getElementById('depAmount').value) || 0;
        const points = val * parseFloat(activeChannel.exchange_rate);
        document.getElementById('calcPoints').innerText = points.toFixed(0);
    }

    // ★★★ 核心修复：充值逻辑 ★★★
    async function doDeposit() {
        if (!activeChannel) return alert("请选择支付方式");
        const amount = document.getElementById('depAmount').value;
        if (!amount || amount < 1) return alert("请输入金额");

        const btn = document.querySelector('#depositInputArea button');
        btn.disabled = true; btn.innerText = "处理中...";

        try {
            const res = await axios.post('/api/deposit', {
                amount: amount,
                method: activeChannel.slug
            });

            const data = res.data.data;
            const resultArea = document.getElementById('depResult');
            resultArea.style.display = 'block';
            resultArea.innerHTML = ""; // 清空旧内容

            // A. Stars 支付 (兼容安卓)
            if (data.type === 'stars') {
                resultArea.innerHTML = `<p style="text-align:center">正在拉起 Telegram 支付...</p>`;

                let invoiceInput = data.url;
                // 提取 slug
                if (invoiceInput.includes('t.me/')) {
                    invoiceInput = invoiceInput.split('t.me/')[1];
                }

                tg.openInvoice(invoiceInput, function(status) {
                    if (status === 'paid') {
                        tg.close();
                        closeWallet();
                        alert("充值成功！");
                        refreshBalance();
                    } else if (status === 'cancelled') {
                        console.log("支付取消");
                    } else {
                        resultArea.innerHTML = `<p style="color:red;text-align:center">状态: ${status}</p>`;
                    }
                });
            }
            // B. URL 跳转 (USDT / NOWPayments)
            else if (data.type === 'url') {
                resultArea.innerHTML = `<p style="text-align:center">正在跳转...</p>`;

                if (window.Telegram?.WebApp) {
                    tg.openLink(data.url);
                } else {
                    window.location.href = data.url;
                }
                alert("请在浏览器完成支付后返回");
                closeWallet();
            }
            // C. 手动转账 (已移除模拟测试按钮)
            else if (data.type === 'manual') {
                resultArea.innerHTML = `
                    <p style="font-size:12px; color:#555;">请转账 <b>${data.amount}</b> 至：</p>
                    <div style="background:#fff; padding:5px; border:1px dashed #ccc; margin:5px 0;">
                        <div style="word-break:break-all; color:#d32f2f; font-weight:bold; font-size:13px;">${data.address}</div>
                    </div>
                    <p style="font-size:10px; color:#999;">订单号: ${data.order_no}</p>
                    <button onclick="closeWallet()" style="width:100%; margin-top:5px;">我已转账</button>
                `;
            }

        } catch (e) {
            alert("错误: " + (e.response?.data?.message || e.message));
        } finally {
            btn.disabled = false; btn.innerText = "立即支付";
        }
    }

    async function doWithdraw() {
        const amount = document.getElementById('wdrAmount').value;
        const address = document.getElementById('wdrAddress').value;
        if(!amount || amount < 10) return alert("最小提现 10 元");
        if(!address || address.length < 5) return alert("请输入正确地址");
        try {
            const res = await axios.post('/api/withdraw', { amount: amount, address: address });
            alert(res.data.message);
            refreshBalance();
            closeWallet();
        } catch (e) {
            alert("错误: " + (e.response?.data?.message || e.message));
        }
    }
</script>
