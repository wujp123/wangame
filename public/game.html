<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Royal Fruit Machine</title>

    <!-- 核心依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://pixijs.download/v7.x/pixi.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@500;900&display=swap');

        :root {
            --bg-body: #121212;
            --machine-red: #b71c1c;
            --panel-blue: linear-gradient(180deg, #1e88e5 0%, #0d47a1 100%);
            --gold-text: #ffd700;
            --led-bg: #000;
            --led-red: #ff3d00;
            --led-green: #76ff03;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-body);
            height: 100vh; width: 100vw;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            display: flex; justify-content: center;
        }

        /* --- 主容器：纵向 Flex 布局 --- */
        #app-root {
            width: 100%; height: 100%;
            max-width: 500px; /* 平板限制宽度 */
            background: #3e2723;
            display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
        }

        /* 1. 顶部 LED 信息区 */
        .header-lcd {
            flex: 0 0 60px;
            background: linear-gradient(to bottom, #3e2723, #210e0e);
            border-bottom: 2px solid #ffd700;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 10px;
            z-index: 10;
        }

        .lcd-group { display: flex; flex-direction: column; align-items: center; }
        .lcd-label { color: #81d4fa; font-size: 10px; margin-bottom: 2px; font-weight: bold; letter-spacing: 1px; }

        .lcd-screen {
            background: #000; border: 1px solid #555; border-radius: 4px;
            padding: 2px 8px; min-width: 70px; text-align: right;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.1);
        }

        .lcd-val { font-family: 'Orbitron', monospace; font-size: 16px; line-height: 1.2; }
        .val-win { color: var(--led-red); text-shadow: 0 0 4px var(--led-red); }
        .val-credit { color: var(--led-green); text-shadow: 0 0 4px var(--led-green); }

        .jackpot-group { flex: 1; text-align: center; margin: 0 5px; }
        .jackpot-val {
            font-family: 'Orbitron'; color: var(--gold-text); font-size: 18px;
            text-shadow: 0 0 10px #ff6f00;
        }

        /* 2. 中部游戏画布 (自适应) */
        #game-stage {
            flex: 1; /* 占据剩余所有高度 */
            background: radial-gradient(circle, #5d4037 10%, #3e2723 90%);
            position: relative;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            border-left: 5px solid var(--machine-red);
            border-right: 5px solid var(--machine-red);
        }

        /* 3. 底部控制台 (核心 UI) */
        .control-panel {
            flex: 0 0 auto; /* 高度自适应内容 */
            background: var(--panel-blue);
            border-top: 3px solid #90caf9;
            padding: 8px;
            padding-bottom: max(10px, env(safe-area-inset-bottom)); /* 适配 iPhone X+ 底部条 */
            display: flex; flex-direction: column; gap: 8px;
        }

        /* 赔率显示条 */
        .odds-strip {
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.3); padding: 4px 6px; border-radius: 4px;
        }
        .odds-tag { color: rgba(255,255,255,0.7); font-size: 9px; font-weight: bold; }

        /* 下注按钮网格 */
        .bet-grid {
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
        }

        .bet-unit { display: flex; flex-direction: column; gap: 2px; }

        .bet-lcd {
            background: #000; color: #fff; text-align: center;
            font-family: 'Orbitron'; font-size: 9px; padding: 2px 0;
            border: 1px solid #444; border-radius: 2px;
        }

        .btn-fruit {
            aspect-ratio: 1; width: 100%;
            border-radius: 6px; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; position: relative;
            box-shadow: 0 3px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: transform 0.1s;
        }
        .btn-fruit:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }

        /* 颜色类 */
        .c-bar { background: linear-gradient(#66bb6a, #2e7d32); }
        .c-77 { background: linear-gradient(#ab47bc, #7b1fa2); }
        .c-star { background: linear-gradient(#fff176, #fbc02d); color: #333; }
        .c-wtr { background: linear-gradient(#ef5350, #c62828); }
        .c-bell { background: linear-gradient(#ffca28, #ff6f00); }
        .c-lem { background: linear-gradient(#d4e157, #9e9d24); }
        .c-org { background: linear-gradient(#ffa726, #e65100); }
        .c-app { background: linear-gradient(#ef5350, #b71c1c); }

        /* 操作按钮行 */
        .action-row { display: flex; gap: 8px; height: 50px; }
        .act-btn {
            border: none; border-radius: 8px; color: #fff; font-weight: bold;
            font-size: 16px; text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); cursor: pointer;
        }
        .act-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }

        .btn-wallet { flex: 1; background: linear-gradient(#42a5f5, #1565c0); }
        .btn-auto { flex: 1; background: linear-gradient(#ba68c8, #7b1fa2); }
        .btn-spin {
            flex: 2; background: linear-gradient(#ffeb3b, #fbc02d);
            color: #d50000; font-size: 22px; border: 2px solid #fff;
        }

        /* 遮罩层 */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            color: #ffeb3b; font-family: 'Orbitron';
        }

        /* 简单弹窗 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal-box {
            background: #fff; width: 80%; padding: 20px; border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- 启动加载页 -->
<div id="loader">SYSTEM INITIALIZING...</div>

<div id="app-root">
    <!-- 1. 顶部数显 -->
    <div class="header-lcd">
        <div class="lcd-group">
            <span class="lcd-label">WIN</span>
            <div class="lcd-screen"><span class="lcd-val val-win" id="win-display">0</span></div>
        </div>
        <div class="jackpot-group">
            <span class="lcd-label" style="color:#ffca28">GRAND JACKPOT</span>
            <div class="jackpot-val" id="jackpot-display">8,888.88</div>
        </div>
        <div class="lcd-group">
            <span class="lcd-label">CREDIT</span>
            <div class="lcd-screen"><span class="lcd-val val-credit" id="credit-display">5000</span></div>
        </div>
    </div>

    <!-- 2. PIXI 游戏区 -->
    <div id="game-stage"></div>

    <!-- 3. 底部操作区 -->
    <div class="control-panel">
        <!-- 赔率条 -->
        <div class="odds-strip" id="odds-container">
            <!-- JS 动态生成 -->
        </div>

        <!-- 8个下注按钮 -->
        <div class="bet-grid" id="bet-container">
            <!-- JS 动态生成 -->
        </div>

        <!-- 功能按钮 -->
        <div class="action-row">
            <button class="act-btn btn-wallet" onclick="showModal('充值功能暂未开放')">充值</button>
            <button class="act-btn btn-auto" id="btn-auto" onclick="toggleAuto()">AUTO</button>
            <button class="act-btn btn-spin" onclick="startGame()">SPIN</button>
        </div>
    </div>
</div>

<!-- 弹窗 -->
<div id="modal" class="modal-overlay">
    <div class="modal-box">
        <h3 id="modal-msg">Message</h3>
        <button class="act-btn btn-wallet" style="padding:10px 30px;" onclick="closeModal()">确定</button>
    </div>
</div>

<script>
    // === 配置数据 ===
    // 对应 Image 3 的 8 个下注选项
    const FRUITS = [
        { id: 1, name: 'BAR', color: 'c-bar', icon: '💎', odds: 100 },
        { id: 2, name: '77',  color: 'c-77',  icon: '7️⃣', odds: 40 },
        { id: 3, name: 'STAR',color: 'c-star',icon: '⭐', odds: 30 },
        { id: 4, name: 'WTR', color: 'c-wtr', icon: '🍉', odds: 20 },
        { id: 5, name: 'BELL',color: 'c-bell',icon: '🔔', odds: 20 },
        { id: 6, name: 'LEM', color: 'c-lem', icon: '🍋', odds: 15 },
        { id: 7, name: 'ORG', color: 'c-org', icon: '🍊', odds: 10 },
        { id: 8, name: 'APP', color: 'c-app', icon: '🍎', odds: 5 }
    ];

    // 24格盘面布局 (顺时针: 左上 -> 右上 -> 右下 -> 左下)
    // 这里的 ID 对应上面 FRUITS 的 ID，9 代表 Luck/Special
    const LAYOUT = [
        7, 6, 1, 1, 2, 2, 8, // 上边
        5, 5,                // 右边
        5, 6,
        4, 4,
        8, 7, 7, 3, 3, 6, 8, // 下边
        8, 8,                // 左边
        4, 8
    ];

    // === 状态变量 ===
    let app, boardContainer;
    let gridSquares = []; // 存储格子的引用
    let bets = {};
    let balance = 5000;
    let isSpinning = false;
    let autoEnabled = false;
    let currentHighlight = 0;

    // === 音效 (使用 Howler) ===
    const sfxClick = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'], volume:0.3 });
    const sfxSpin  = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2044/2044-preview.mp3'], loop:true, volume:0.3 });
    const sfxWin   = new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'] });

    // === 初始化 ===
    window.onload = function() {
        initTelegram();
        initPixi();
        initUI();
        document.getElementById('loader').style.display = 'none';
    };

    function initTelegram() {
        if(window.Telegram?.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            try { tg.setHeaderColor('#3e2723'); } catch(e){}
        }
    }

    // === 核心逻辑：PixiJS 渲染与自适应 ===
    function initPixi() {
        const container = document.getElementById('game-stage');

        // 逻辑分辨率：保持正方形设计，480x480
        const logicSize = 480;

        app = new PIXI.Application({
            width: logicSize, height: logicSize,
            backgroundAlpha: 0, // 透明背景
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });
        container.appendChild(app.view);

        // 绘制盘面
        drawBoard(logicSize);

        // --- 关键：强制响应式缩放 ---
        // 监听窗口大小，动态调整 Canvas 的 style.width/height，使其永远不超出容器
        function resize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            const ratio = Math.min(w / logicSize, h / logicSize) * 0.96; // 留一点边距

            app.view.style.width = (logicSize * ratio) + 'px';
            app.view.style.height = (logicSize * ratio) + 'px';
        }
        window.addEventListener('resize', resize);
        resize();
    }

    function drawBoard(size) {
        const step = 58; // 格子间距
        const boxSize = 54;
        const startX = 35;
        const startY = 35;

        // 生成坐标 (顺时针)
        const coords = [];
        // Top Row (7 items)
        for(let i=0; i<7; i++) coords.push({x: startX + i*step, y: startY});
        // Right Col
        for(let i=1; i<=6; i++) coords.push({x: startX + 6*step, y: startY + i*step});
        // Bottom Row
        for(let i=5; i>=0; i--) coords.push({x: startX + i*step, y: startY + 6*step});
        // Left Col
        for(let i=5; i>=1; i--) coords.push({x: startX, y: startY + i*step});

        // 绘制中心装饰 (LUCKY LOGO)
        const centerCont = new PIXI.Container();
        const bg = new PIXI.Graphics();
        bg.beginFill(0x000000, 0.4);
        bg.drawRoundedRect(0, 0, 300, 300, 20);
        bg.endFill();
        centerCont.addChild(bg);

        const style = new PIXI.TextStyle({
            fontFamily: 'Orbitron', fontSize: 42, fill: ['#ffd700', '#ff6f00'],
            dropShadow: true, dropShadowColor: '#000000', dropShadowBlur: 6, fontWeight:'bold'
        });
        const txt = new PIXI.Text('ROYAL\nCASINO', style);
        txt.anchor.set(0.5); txt.position.set(150, 150);
        centerCont.addChild(txt);

        centerCont.position.set(startX + step - 10, startY + step - 10);
        app.stage.addChild(centerCont);

        // 绘制24个格子
        coords.forEach((pos, idx) => {
            const g = new PIXI.Container();
            g.x = pos.x; g.y = pos.y;

            const fid = LAYOUT[idx];
            const fruit = FRUITS.find(f => f.id === fid) || {icon:'❓', name:'?', color:''};

            // 1. 格子背景
            const box = new PIXI.Graphics();
            box.lineStyle(2, 0x4e342e);
            box.beginFill(0xffecb3);
            box.drawRoundedRect(0, 0, boxSize, boxSize, 8);
            box.endFill();
            g.addChild(box);

            // 2. 图标 (这里用 Text 模拟图标，实际可用 Sprite)
            const iconTxt = new PIXI.Text(fruit.icon, {fontSize: 26});
            iconTxt.anchor.set(0.5);
            iconTxt.position.set(boxSize/2, boxSize/2 - 5);
            g.addChild(iconTxt);

            const nameTxt = new PIXI.Text(fruit.name, {fontSize: 10, fontWeight:'bold', fill:'#333'});
            nameTxt.anchor.set(0.5);
            nameTxt.position.set(boxSize/2, boxSize - 10);
            g.addChild(nameTxt);

            // 3. 高亮框 (默认隐藏)
            const hl = new PIXI.Graphics();
            hl.lineStyle(4, 0xff0000);
            hl.beginFill(0xffff00, 0.3);
            hl.drawRoundedRect(-2, -2, boxSize+4, boxSize+4, 10);
            hl.endFill();
            hl.visible = false;
            g.addChild(hl);

            gridSquares.push({ el: g, hl: hl, id: fid });
            app.stage.addChild(g);
        });

        gridSquares[0].hl.visible = true; // 默认高亮第一个
    }

    // === UI 生成 ===
    function initUI() {
        const oddBox = document.getElementById('odds-container');
        const betBox = document.getElementById('bet-container');

        FRUITS.forEach(f => {
            bets[f.id] = 0;

            // 1. 赔率条
            const tag = document.createElement('span');
            tag.className = 'odds-tag';
            tag.innerText = `${f.name} x${f.odds}`;
            oddBox.appendChild(tag);

            // 2. 下注按钮
            const div = document.createElement('div');
            div.className = 'bet-unit';
            div.innerHTML = `
                <div class="bet-lcd" id="bet-val-${f.id}">0</div>
                <button class="btn-fruit ${f.color}" onclick="addBet(${f.id})">
                    ${f.icon}
                </button>
            `;
            betBox.appendChild(div);
        });
        updateBalanceDisplay();
    }

    // === 游戏逻辑 ===
    function addBet(id) {
        if(isSpinning) return;
        if(balance < 10) return showModal("余额不足！");

        sfxClick.play();
        bets[id] += 10;
        balance -= 10;

        document.getElementById(`bet-val-${id}`).innerText = bets[id];
        updateBalanceDisplay();
        haptic('light');
    }

    function updateBalanceDisplay() {
        document.getElementById('credit-display').innerText = balance;
    }

    function toggleAuto() {
        autoEnabled = !autoEnabled;
        const btn = document.getElementById('btn-auto');
        btn.style.filter = autoEnabled ? 'brightness(1.5)' : 'none';
        btn.innerText = autoEnabled ? 'ON' : 'AUTO';
        haptic('medium');
    }

    function startGame() {
        if(isSpinning) return;
        const totalBet = Object.values(bets).reduce((a,b)=>a+b, 0);
        if(totalBet === 0) return showModal("请先下注！");

        isSpinning = true;
        sfxSpin.play();
        document.getElementById('win-display').innerText = '0';
        haptic('heavy');

        // 模拟后端结果 (随机)
        const targetIdx = Math.floor(Math.random() * 24);
        const winId = LAYOUT[targetIdx];

        runAnimation(targetIdx, () => {
            sfxSpin.stop();
            isSpinning = false;

            // 结算逻辑
            const betAmt = bets[winId] || 0;
            const fruit = FRUITS.find(f=>f.id === winId);
            const winAmt = betAmt * (fruit ? fruit.odds : 0);

            if(winAmt > 0) {
                sfxWin.play();
                balance += winAmt;
                updateBalanceDisplay();
                document.getElementById('win-display').innerText = winAmt;
                haptic('success');
                blinkHighlight(targetIdx);
            }

            // 自动开始逻辑
            if(autoEnabled) {
                if(balance >= totalBet) {
                    // 扣除下注额
                    FRUITS.forEach(f => {
                        if(bets[f.id] > 0) balance -= bets[f.id];
                    });
                    updateBalanceDisplay();
                    setTimeout(startGame, 1500);
                } else {
                    autoEnabled = false;
                    toggleAuto(); // UI Update
                    showModal("余额不足以自动续投");
                }
            }
        });
    }

    function runAnimation(targetIndex, callback) {
        let rounds = 0;
        const minRounds = 3;
        let speed = 50;

        function step() {
            // 移动高亮
            gridSquares[currentHighlight].hl.visible = false;
            currentHighlight++;
            if(currentHighlight >= 24) {
                currentHighlight = 0;
                rounds++;
            }
            gridSquares[currentHighlight].hl.visible = true;

            // 停止条件
            if(rounds >= minRounds && currentHighlight === targetIndex) {
                callback();
            } else {
                // 简单的变速逻辑
                if(rounds < minRounds - 1) {
                    // 加速
                    if(speed > 30) speed -= 2;
                } else {
                    // 减速
                    speed += 10;
                }
                setTimeout(step, speed);
            }
        }
        step();
    }

    function blinkHighlight(idx) {
        let count = 0;
        const interval = setInterval(() => {
            gridSquares[idx].hl.visible = !gridSquares[idx].hl.visible;
            count++;
            if(count > 8) {
                clearInterval(interval);
                gridSquares[idx].hl.visible = true;
            }
        }, 100);
    }

    // === 辅助 ===
    function showModal(msg) {
        document.getElementById('modal-msg').innerText = msg;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }
    function haptic(style) {
        if(window.Telegram?.WebApp?.HapticFeedback) {
            if(style==='success') window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            else window.Telegram.WebApp.HapticFeedback.impactOccurred(style);
        }
    }
</script>
</body>
</html>
